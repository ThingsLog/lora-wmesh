; W-Mesh field node — SeeedStudio Wio-E5 mini (STM32WLE5JC).
; The production-silicon port: MCU and SX126x-class radio share one die, the
; RTC runs through STOP2 at microamperes — this is the power posture the
; paper budgets (Table IV), not the bench-grade XIAO approximation.
;
; Build:  pio run
; Flash:  no ST-Link needed — the ROM bootloader talks through the onboard
;         CP2102 USB-UART. Hold BOOT, tap RESET, release BOOT, then:
;           stm32flash -k /dev/cu.usbserial-XXXX   # one-time RDP unlock,
;                                                  # MASS-ERASES the factory
;                                                  # AT firmware (deliberate)
;           stm32flash -v -w .pio/build/wio-e5-wmesh/firmware.bin -b 115200 \
;                      -S 0x08000000 /dev/cu.usbserial-XXXX
;         (ST-Link via `upload_protocol = stlink` remains the SWD fallback.)

[env:wio-e5-wmesh]
platform = ststm32@17.5.0
board = lora_e5_mini
framework = arduino
platform_packages =
  platformio/framework-arduinoststm32 @ https://github.com/stm32duino/Arduino_Core_STM32/archive/refs/tags/2.8.1.zip
build_flags =
  -I../../core
  -DHAL_SUBGHZ_MODULE_ENABLED
lib_deps =
  jgromes/RadioLib@^7.2.1
  stm32duino/STM32duino RTC@^1.6.0
  stm32duino/STM32duino Low Power@^1.4.0
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-*
