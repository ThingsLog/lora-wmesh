; W-Mesh bench node — Seeed XIAO nRF52840 + Wio-SX1262 (kit SKU 102010710).
; Bare-leaf profile: no GNSS, no HDC3020 — battery telemetry only (ports=1).
;
; Toolchain notes:
; - The factory XIAO bootloader carries SoftDevice S140 v7.3.0 (fwid 0x0123);
;   the app MUST be linked with nrf52840_s140_v7.ld or it will not boot.
;   Both come from the Seeed fork of the Adafruit nRF52 core below — do not
;   swap in the stock PlatformIO framework package (it is S140 v6 only).
; - Upload: adafruit-nrfutil serial DFU (1200 bps touch resets into the
;   bootloader automatically; or double-tap reset for a manual entry).

[platformio]
boards_dir = boards
default_envs = xiao-wmesh-leaf

[env:xiao-wmesh-leaf]
platform = platformio/nordicnrf52@^10.12.0
platform_packages =
  platformio/framework-arduinoadafruitnrf52 @ https://github.com/Seeed-Studio/Adafruit_nRF52_Arduino.git
board = seeed_xiao_nrf52840
framework = arduino
build_flags =
  -I../../core
  -DCONFIG_NFCT_PINS_AS_GPIOS=1
  -DUSE_TINYUSB              ; WITHOUT this, Serial is the hardware UART and
                             ; USB CDC never enumerates — the node goes dark
lib_deps =
  jgromes/RadioLib@^7.2.1
; Link library objects directly instead of .a archives: the core references
; TinyUSB_Device_Init only WEAKLY, and a weak ref never extracts the strong
; definition out of an archive — the USB stack silently never starts.
lib_archive = no
monitor_speed = 115200
upload_protocol = nrfutil

; Air sniffer: continuous RX, prints every frame (hex + RSSI/SNR + decoded
; mesh header / beacon). Flash one bench board with this to watch the others:
;   pio run -e xiao-sniffer -t upload
[env:xiao-sniffer]
extends = env:xiao-wmesh-leaf
build_src_filter = -<*> +<../sniffer/>

; GNSS bring-up probe: mirrors the L76K NMEA stream + parsed GGA to USB:
;   pio run -e xiao-gpsprobe -t upload
[env:xiao-gpsprobe]
extends = env:xiao-wmesh-leaf
build_src_filter = -<*> +<../gpsprobe/>

; Toolchain bring-up check (LED + CDC counter), no W-Mesh code at all:
;   pio run -e xiao-hello -t upload
[env:xiao-hello]
extends = env:xiao-wmesh-leaf
build_src_filter = -<*> +<../hello/>
